name: 'Continuous Integration'

on:
  schedule:
    - cron: '0 2 * * *'
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  docker-build:
    name: "Build ${{ matrix.php-version }}-${{ matrix.base-image }}"

    runs-on: "ubuntu-latest"

    env:
      IMAGE: "ghcr.io/core23/jenkins-php-agent:${{ matrix.php-version }}-${{ matrix.base-image }}"

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"

        base-image:
          - "alpine"
          - "debian"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"

      - name: "Setup Docker Buildx"
        uses: "docker/setup-buildx-action@v4"

      - name: "Build"
        uses: "docker/build-push-action@v7"
        with:
          context: "php/${{ matrix.base-image }}"
          build-args: "PHP_VERSION=${{ matrix.php-version }}"
          load: true
          tags: "${{ env.IMAGE }}"
          # Scheduled builds must pick up fresh upstream packages
          no-cache: ${{ github.event_name == 'schedule' }}
          pull: true
          cache-from: "type=gha,scope=${{ matrix.php-version }}-${{ matrix.base-image }}"
          cache-to: "type=gha,mode=max,scope=${{ matrix.php-version }}-${{ matrix.base-image }}"

      - name: "History"
        run: "docker image history ${{ env.IMAGE }}"

      - name: "Size"
        run: "docker images ${{ env.IMAGE }} --format \"{{.Repository}}:{{.Tag}} -> {{.Size}}\""

      - name: "Smoke test"
        run: "docker run --rm -i --entrypoint sh ${{ env.IMAGE }} -s < .github/scripts/smoke-test.sh"
