name: "Build and push containers"

on:
  schedule:
    - cron: '31 19 * * *'
  push:
    branches: [ main ]

permissions:
  contents: read

env:
  NODE_VERSION: "24"

jobs:
  release-container:
    name: "Push Docker image to GitHub Packages"

    runs-on: "ubuntu-latest"

    strategy:
      matrix:
        php-version:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"

        base-image:
          - "alpine"
          - "debian"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"

      - name: "Docker meta"
        id: "meta"
        uses: "docker/metadata-action@v6"
        with:
          flavor: |
            latest=false
          images: |
            core23/jenkins-php-agent
            ghcr.io/core23/jenkins-php-agent
          tags: |
            type=raw,value=${{ matrix.php-version }}-${{ matrix.base-image }}
            type=raw,value=${{ matrix.php-version }},enable=${{ startsWith(matrix.base-image, 'alpine') }}
            # latest points to the newest PHP version on Alpine, update it when a new PHP version is added
            type=raw,value=latest,enable=${{ matrix.php-version == '8.5' && matrix.base-image == 'alpine' }}

      - name: "Setup Docker Buildx"
        uses: "docker/setup-buildx-action@v4"

      - name: "Login to GitHub Container Registry"
        uses: "docker/login-action@v4.6.0"
        with:
          registry: ghcr.io
          username: ${{ secrets.CONTAINER_GH_USERNAME }}
          password: ${{ secrets.CONTAINER_GH_PAT }}

      - name: "Login to DockerHub Registry"
        uses: "docker/login-action@v4.6.0"
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: "Build and push"
        uses: "docker/build-push-action@v7"
        with:
          context: "php/${{ matrix.base-image }}"
          build-args: |
            PHP_VERSION=${{ matrix.php-version }}
            NODE_VERSION=${{ env.NODE_VERSION }}
          platforms: "linux/amd64"
          push: true
          tags: "${{ steps.meta.outputs.tags }}"
          labels: "${{ steps.meta.outputs.labels }}"
          # Scheduled builds must pick up fresh upstream packages
          no-cache: ${{ github.event_name == 'schedule' }}
          pull: true
          cache-from: "type=gha,scope=${{ matrix.php-version }}-${{ matrix.base-image }}"
          cache-to: "type=gha,mode=max,scope=${{ matrix.php-version }}-${{ matrix.base-image }}"
