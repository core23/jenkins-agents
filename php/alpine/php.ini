zend_extension="xdebug.so"

; Xdebug only on demand, e.g. XDEBUG_MODE=coverage
xdebug.mode=off

[PHP]
file_uploads = On
upload_max_filesize = 256M
post_max_size = 256M
memory_limit = -1

[Date]
date.timezone="UTC"

[opcache]
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=128
opcache.max_accelerated_files=30000
opcache.revalidate_freq=0

; JIT is disabled: PHP disables it anyway when extensions like Xdebug are loaded and warns on every run
opcache.jit_buffer_size=0
